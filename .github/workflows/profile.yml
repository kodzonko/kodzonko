name: Profile

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/profile.yml]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Optional METRICS_TOKEN (classic PAT, `repo` + `read:user`) adds private contributions;
      # the built-in token covers public activity.
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          config_timezone: Europe/Warsaw
          base: header, activity
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

