name: Languages

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/languages.yml, .github/languages.py]

jobs:
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Render card
        env:
          # Fine-grained PAT, all repositories, read-only. It only reads; the push below uses the built-in token.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        # ponytail: first 100 repositories only, paginate if that is ever exceeded.
        run: |
          gh api graphql -f query='{viewer{repositories(first:100,ownerAffiliations:OWNER,isFork:false){nodes{languages(first:20){edges{size node{name color}}}}}}}' > "$RUNNER_TEMP/repos.json"
          python3 .github/languages.py "$RUNNER_TEMP/repos.json" github-languages
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-languages-*.svg
          git diff --cached --quiet || { git commit -m "chore: update languages card"; git push; }
