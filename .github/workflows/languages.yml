name: Languages

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/languages.yml]

jobs:
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # METRICS_TOKEN: fine-grained PAT, all repositories, Contents read-only. Commits use the built-in token.
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, shell, batchfile, dockerfile, makefile, hcl
